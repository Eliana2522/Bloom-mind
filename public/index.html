<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bloom Mind — Iniciar Sesión</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
    }

    /* ══ PANEL IZQUIERDO ══ */
    .branding {
      flex: 1.1;
      background: linear-gradient(145deg, #2d0d6b 0%, #5b21b6 40%, #7c3aed 70%, #a855f7 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 52px;
      position: relative;
      overflow: hidden;
    }

    /* Círculos decorativos de fondo */
    .branding::before {
      content: '';
      position: absolute;
      width: 420px; height: 420px;
      border-radius: 50%;
      background: rgba(255,255,255,0.05);
      top: -120px; left: -100px;
    }
    .branding::after {
      content: '';
      position: absolute;
      width: 300px; height: 300px;
      border-radius: 50%;
      background: rgba(255,255,255,0.06);
      bottom: -80px; right: -80px;
    }
    .blob {
      position: absolute;
      width: 180px; height: 180px;
      border-radius: 50%;
      background: rgba(255,255,255,0.04);
      bottom: 140px; left: 30px;
    }

    .branding-content {
      position: relative;
      z-index: 1;
      text-align: center;
      color: #fff;
      max-width: 340px;
    }

    /* Logo */
    .logo-circle {
      width: 88px; height: 88px;
      border-radius: 24px;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(8px);
      border: 1.5px solid rgba(255,255,255,0.25);
      display: flex; align-items: center; justify-content: center;
      font-size: 40px;
      margin: 0 auto 28px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    }

    .brand-name {
      font-family: 'Playfair Display', serif;
      font-size: 2.6rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.1;
      margin-bottom: 10px;
    }

    .brand-tagline {
      font-size: 14px;
      font-weight: 300;
      opacity: 0.75;
      letter-spacing: 0.1em;
      margin-bottom: 44px;
      font-style: italic;
    }

    .features {
      display: flex;
      flex-direction: column;
      gap: 14px;
      text-align: left;
      width: 100%;
    }
    .feature {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 14px;
      font-weight: 400;
      opacity: 0.88;
    }
    .feature-icon {
      width: 34px; height: 34px;
      border-radius: 10px;
      background: rgba(255,255,255,0.15);
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; flex-shrink: 0;
    }

    .divider-branding {
      width: 48px; height: 2px;
      background: rgba(255,255,255,0.25);
      border-radius: 2px;
      margin: 0 auto 36px;
    }

    /* ══ PANEL DERECHO (FORMULARIO) ══ */
    .form-panel {
      flex: 0.9;
      background: #faf8ff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 40px;
    }

    .form-box {
      width: 100%;
      max-width: 380px;
    }

    .form-header {
      margin-bottom: 32px;
    }
    .form-titulo {
      font-family: 'Playfair Display', serif;
      font-size: 1.7rem;
      font-weight: 700;
      color: #2d1b69;
      margin-bottom: 6px;
    }
    .form-sub {
      font-size: 13px;
      color: #9d91b8;
      font-weight: 400;
    }

    /* Campos */
    .campo { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
    .campo label {
      font-size: 12px; font-weight: 600; color: #7c6fa0;
      text-transform: uppercase; letter-spacing: 0.07em;
    }
    .campo input {
      padding: 12px 16px;
      border: 1.5px solid rgba(124,58,237,0.2);
      border-radius: 11px;
      font-family: 'DM Sans', sans-serif; font-size: 15px; color: #2d1b69;
      outline: none; background: #fff;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .campo input:focus {
      border-color: #7c3aed;
      box-shadow: 0 0 0 3px rgba(124,58,237,0.1);
    }

    /* Botón */
    .btn-login {
      width: 100%; padding: 14px;
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      color: #fff; border: none; border-radius: 12px;
      font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 600;
      cursor: pointer; margin-top: 6px;
      transition: opacity 0.2s, transform 0.15s;
      letter-spacing: 0.01em;
      box-shadow: 0 4px 16px rgba(124,58,237,0.35);
    }
    .btn-login:hover  { opacity: 0.9; transform: translateY(-1px); }
    .btn-login:active { transform: translateY(0); }

    /* Mensajes */
    .msg-err { color: #dc2626; font-size: 13px; text-align: center; margin-top: 12px; display: none; }
    .msg-ok  { color: #16a34a; font-size: 13px; text-align: center; margin-top: 12px; display: none; }

    /* ══ RESPONSIVE ══ */
    @media (max-width: 768px) {
      body { flex-direction: column; }
      .branding {
        padding: 40px 32px 36px;
        flex: none;
      }
      .features { display: none; }
      .brand-tagline { margin-bottom: 0; }
      .divider-branding { display: none; }
      .logo-circle { width: 68px; height: 68px; font-size: 30px; margin-bottom: 16px; border-radius: 18px; }
      .brand-name { font-size: 2rem; }
      .form-panel { padding: 36px 24px; }
    }
  </style>
</head>
<body>

  <!-- ══ PANEL IZQUIERDO — BRANDING ══ -->
  <div class="branding">
    <div class="blob"></div>
    <div class="branding-content">

      <div class="logo-circle">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.95)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
        </svg>
      </div>

      <div class="brand-name">Bloom Mind</div>
      <div class="brand-tagline">donde las ideas florecen</div>

      <div class="divider-branding"></div>

      <div class="features">
        <div class="feature">
          <div class="feature-icon">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
            </svg>
          </div>
          <span>Catálogo de libros con búsqueda y filtros</span>
        </div>
        <div class="feature">
          <div class="feature-icon">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
              <rect x="8" y="2" width="8" height="4" rx="1"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="13" y2="16"/>
            </svg>
          </div>
          <span>Registro y control de préstamos</span>
        </div>
        <div class="feature">
          <div class="feature-icon">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.14"/>
            </svg>
          </div>
          <span>Gestión de devoluciones y moras</span>
        </div>
        <div class="feature">
          <div class="feature-icon">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
          </div>
          <span>Administración de socios y biblioteca</span>
        </div>
      </div>

    </div>
  </div>

  <!-- ══ PANEL DERECHO — FORMULARIO ══ -->
  <div class="form-panel">
    <div class="form-box">

      <div class="form-header">
        <div class="form-titulo">Bienvenido/a</div>
        <div class="form-sub">Accede con tu cuenta de administrador</div>
      </div>

      <div class="campo">
        <label>Usuario</label>
        <input type="text" id="loginUser" placeholder="Ej: admin" autocomplete="username"/>
      </div>
      <div class="campo">
        <label>Contraseña</label>
        <input type="password" id="loginPass" placeholder="••••••" autocomplete="current-password"/>
      </div>
      <button class="btn-login" onclick="login()">Ingresar</button>
      <div class="msg-err" id="loginErr"></div>

    </div>
  </div>

  <script>
    async function login() {
      const usuario    = document.getElementById('loginUser').value.trim();
      const contrasena = document.getElementById('loginPass').value.trim();
      const err        = document.getElementById('loginErr');
      err.style.display = 'none';
      if (!usuario || !contrasena) {
        err.textContent = 'Completa todos los campos.'; err.style.display = 'block'; return;
      }
      try {
        const res  = await fetch('/api/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ usuario, contrasena })
        });
        const data = await res.json();
        if (res.ok && data.exito) {
          localStorage.setItem('sesionActiva', 'true');
          localStorage.setItem('rol',      data.rol);
          localStorage.setItem('usuario',  data.usuario);
          localStorage.setItem('usuarioId', data.id);
          window.location.href = '/gestion';
        } else {
          err.textContent = data.mensaje; err.style.display = 'block';
        }
      } catch (e) {
        err.textContent = 'No se pudo conectar con el servidor.'; err.style.display = 'block';
      }
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') login();
    });
  </script>
</body>
</html>
