<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bloom Mind — Catálogo</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
  <style>
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(13,11,26,0.75); backdrop-filter: blur(6px);
      display: none; align-items: center; justify-content: center;
      z-index: 500; padding: 20px;
    }
    .modal-box {
      background: #ffffff; border-radius: 20px;
      max-width: 600px; width: 100%;
      max-height: 90vh; overflow-y: auto;
      box-shadow: 0 30px 80px rgba(124,58,237,0.25);
      animation: slideUp 0.3s ease;
    }
    @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .modal-close {
      position: absolute; top: 14px; right: 16px;
      background: rgba(255,255,255,0.2); border: none;
      color: #fff; font-size: 20px; width: 34px; height: 34px;
      border-radius: 50%; cursor: pointer; display: flex;
      align-items: center; justify-content: center; transition: background 0.2s;
    }
    .modal-close:hover { background: rgba(255,255,255,0.35); }
    .modal-body { padding: 24px 28px 30px; }
    .modal-titulo {
      font-family: 'Playfair Display', serif; font-size: 1.6rem;
      font-weight: 700; color: #2d1b69; margin-bottom: 6px; line-height: 1.2;
    }
    .modal-autor { font-size: 14px; color: #7c6fa0; margin-bottom: 12px; font-weight: 400; }
    .modal-meta  { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    .modal-badge { font-size: 12px; padding: 4px 12px; border-radius: 20px; font-weight: 500; }
    .modal-info  { font-size: 12px; color: #9d91b8; }
    .modal-resumen p {
      font-size: 14.5px; color: #4a3f6b; line-height: 1.75;
      margin-bottom: 14px; font-weight: 300;
    }
    .modal-resumen p:last-child { margin-bottom: 0; }
    .modal-dispon {
      display: inline-block; font-size: 12px; padding: 4px 12px;
      border-radius: 20px; font-weight: 600;
    }
  </style>
</head>
<body>

  <!-- MODAL DETALLE LIBRO -->
  <div class="modal-overlay" id="modal" onclick="cerrarModalFuera(event)">
    <div class="modal-box">
      <div class="modal-cover" id="modal-color">
        <div class="modal-cover-spine"></div>
        <div class="modal-cover-text">
          <div id="modal-cover-titulo"></div>
          <div id="modal-cover-autor"></div>
        </div>
        <button class="modal-close" onclick="cerrarModal()">✕</button>
      </div>
      <div class="modal-body">
        <div class="modal-titulo" id="modal-titulo"></div>
        <div class="modal-autor"  id="modal-autor"></div>
        <div class="modal-meta">
          <span class="modal-badge"  id="modal-cat"></span>
          <span class="modal-info"   id="modal-paginas"></span>
          <span class="modal-info"   id="modal-año"></span>
          <span class="modal-dispon" id="modal-dispon"></span>
        </div>
        <div class="modal-resumen" id="modal-resumen"></div>
      </div>
    </div>
  </div>

  <!-- BIBLIOTECA -->
  <header class="hero">
    <div class="hero-eyebrow">Colección Digital</div>
    <h1>Bloom Mind</h1>
    <p class="hero-subtitle">donde las ideas florecen</p>
    <p>Explora nuestro catálogo y consulta la disponibilidad</p>
    <div class="search-bar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input type="text" id="searchInput" placeholder="Buscar por título, autor o categoría..." autocomplete="off" />
      <button class="search-btn" onclick="filtrar()">Buscar</button>
    </div>
  </header>

  <main class="main">
    <p class="cats-label">Categorías</p>
    <div class="cats" id="cats"></div>
    <div class="divider"></div>
    <div class="stats-bar">
      <span>Mostrando <strong id="count">0</strong> libros</span>
      <span id="cat-label">Todos los géneros</span>
    </div>
    <div class="grid" id="grid"></div>
  </main>

  <script src="/js/script.js"></script>
  <script>
    function cerrarModalFuera(e) {
      if (e.target === document.getElementById('modal')) cerrarModal();
    }
    cargarLibros();
  </script>

</body>
</html>
