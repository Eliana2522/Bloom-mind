<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bloom Mind — Devoluciones</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/styles.css"/>
</head>
<body>
  <script>
    if (localStorage.getItem('sesionActiva') !== 'true' || localStorage.getItem('rol') !== 'admin')
      window.location.href = '/';
  </script>

  <nav class="admin-nav">
    <span class="nav-brand">Bloom Mind</span>
    <div class="nav-links">
      <a href="/gestion" class="nav-link"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>Libros</a>
      <a href="/admin-prestamos" class="nav-link"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="13" y2="16"/></svg>Préstamos</a>
      <a href="/admin-devoluciones" class="nav-link"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.14"/></svg>Devoluciones</a>
      <a href="/admin-moras" class="nav-link"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>Moras</a>
      <a href="/admin-socios" class="nav-link"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>Socios</a>
    </div>
    <button class="nav-salir" onclick="cerrarSesion()">Cerrar sesión</button>
    <button class="nav-hamburger" id="navHam" onclick="toggleMenu()">
      <span></span><span></span><span></span>
    </button>
  </nav>
  <div class="nav-mobile" id="navMobile">
    <a href="/gestion" class="nav-mobile-link"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>Libros</a>
    <a href="/admin-prestamos" class="nav-mobile-link"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="13" y2="16"/></svg>Préstamos</a>
    <a href="/admin-devoluciones" class="nav-mobile-link"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.14"/></svg>Devoluciones</a>
    <a href="/admin-moras" class="nav-mobile-link"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>Moras</a>
    <a href="/admin-socios" class="nav-mobile-link"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>Socios</a>
    <div class="nav-mobile-sep"></div>
    <button class="nav-mobile-salir" onclick="cerrarSesion()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>Cerrar sesión</button>
  </div>
  <div class="nav-mobile-overlay" id="navOverlay" onclick="toggleMenu()"></div>

  <div class="page">
    <h1 class="page-title">Devoluciones</h1>
    <p class="page-sub">Libros actualmente prestados. Los vencidos generan mora de $20 por día.</p>

    <div class="stats-grid" id="statsGrid"></div>

    <div class="panel" style="padding:16px 20px;margin-bottom:16px">
      <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
        <input type="text" id="filtro" placeholder="Buscar por socio o libro..."
          style="flex:1;min-width:200px;padding:9px 14px;border:1px solid rgba(124,58,237,0.25);border-radius:10px;font-family:'DM Sans',sans-serif;font-size:13px;color:#2d1b69;outline:none"/>
        <select id="filtroEstado"
          style="padding:9px 14px;border:1px solid rgba(124,58,237,0.25);border-radius:10px;font-family:'DM Sans',sans-serif;font-size:13px;color:#2d1b69;outline:none;background:#fff">
          <option value="todos">Todos los activos</option>
          <option value="vencidos">Solo vencidos</option>
          <option value="vigentes">Solo vigentes</option>
        </select>
        <button class="btn btn-outline btn-sm" onclick="cargar()">Actualizar</button>
      </div>
    </div>

    <div class="panel">
      <div class="tabla-wrap">
        <table class="tabla-cards">
          <thead>
            <tr>
              <th>#</th>
              <th>Socio</th>
              <th>Libro</th>
              <th>Fecha préstamo</th>
              <th>Fecha límite</th>
              <th>Estado</th>
              <th>Mora</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="tablaBody"></tbody>
        </table>
      </div>
      <div class="vacio" id="vacio" style="display:none">
        <span class="icon">—</span><p>No hay préstamos activos</p>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    document.querySelectorAll('.nav-link, .nav-mobile-link').forEach(a => {
      if (a.getAttribute('href') === window.location.pathname) a.classList.add('activo');
    });
    function toggleMenu() {
      document.getElementById('navHam').classList.toggle('open');
      document.getElementById('navMobile').classList.toggle('open');
      document.getElementById('navOverlay').classList.toggle('open');
    }
    function cerrarSesion() { localStorage.clear(); window.location.href = '/'; }
    function toast(msg, tipo = 'ok') {
      const t = document.getElementById('toast');
      t.textContent = msg; t.className = `toast ${tipo} visible`;
      setTimeout(() => t.classList.remove('visible'), 4000);
    }

    let todos = [];

    function fmtFecha(s) {
      return new Date(s + 'T00:00:00').toLocaleDateString('es', { day:'2-digit', month:'2-digit', year:'numeric' });
    }
    function escHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    async function cargar() {
      try {
        const data = await fetch('/api/prestamos').then(r => r.json());
        todos = data.filter(p => !p.fechaDevolucion);
        renderStats();
        renderTabla();
      } catch (e) { toast('Error al cargar préstamos.', 'err'); }
    }

    function renderStats() {
      const activos   = todos.filter(p => p.estado === 'activo').length;
      const vencidos  = todos.filter(p => p.estado === 'vencido').length;
      const totalMora = todos.filter(p => p.estado === 'vencido').reduce((a, p) => a + p.mora, 0);
      document.getElementById('statsGrid').innerHTML = `
        <div class="stat-card"><div class="stat-num">${todos.length}</div><div class="stat-label">Préstamos activos</div></div>
        <div class="stat-card"><div class="stat-num" style="color:#991b1b">${vencidos}</div><div class="stat-label">Vencidos</div></div>
        <div class="stat-card"><div class="stat-num" style="color:#065f46">${activos}</div><div class="stat-label">Vigentes</div></div>
        <div class="stat-card"><div class="stat-num" style="color:#92400e">$${totalMora}</div><div class="stat-label">Mora acumulada</div></div>`;
    }

    function renderTabla() {
      const q      = document.getElementById('filtro').value.toLowerCase();
      const estado = document.getElementById('filtroEstado').value;
      const filtrados = todos.filter(p => {
        const matchQ = !q || p.nombreSocio.toLowerCase().includes(q)
                          || p.cedulaSocio.toLowerCase().includes(q)
                          || p.nombreLibro.toLowerCase().includes(q);
        const matchE = estado === 'todos' || p.estado === (estado === 'vencidos' ? 'vencido' : 'activo');
        return matchQ && matchE;
      });

      const tbody = document.getElementById('tablaBody');
      const vacio = document.getElementById('vacio');
      if (!filtrados.length) { tbody.innerHTML = ''; vacio.style.display = 'block'; return; }
      vacio.style.display = 'none';

      tbody.innerHTML = filtrados.map(p => `
        <tr>
          <td data-label="#">#${p.id}</td>
          <td data-label="Socio">
            <div style="font-weight:500;font-size:13px">${escHtml(p.nombreSocio)}</div>
            <div style="font-size:11px;color:#9d91b8;font-family:monospace">${escHtml(p.cedulaSocio)}</div>
          </td>
          <td data-label="Libro">${escHtml(p.nombreLibro)}</td>
          <td data-label="F. préstamo" style="font-size:13px;color:#7c6fa0">${fmtFecha(p.fechaPrestamo)}</td>
          <td data-label="F. límite" style="font-size:13px;color:${p.estado==='vencido'?'#991b1b':'#2d1b69'};font-weight:${p.estado==='vencido'?'600':'400'}">
            ${fmtFecha(p.fechaLimite)}
          </td>
          <td data-label="Estado">
            <span class="tag tag-${p.estado}">${p.estado}</span>
            ${p.estado === 'vencido' ? `<span style="font-size:11px;color:#9d91b8;margin-left:4px">${p.diasAtraso} día(s)</span>` : ''}
          </td>
          <td data-label="Mora" style="font-weight:600;color:${p.mora > 0 ? '#991b1b' : '#065f46'}">
            ${p.mora > 0 ? '$' + p.mora : '—'}
          </td>
          <td data-label="">
            <button class="btn btn-success btn-sm" onclick="devolver(${p.id}, '${escHtml(p.nombreLibro)}', ${p.mora})">
              Devolver
            </button>
          </td>
        </tr>`).join('');
    }

    async function devolver(id, nombreLibro, mora) {
      const msg = mora > 0
        ? `¿Registrar devolución de "${nombreLibro}"?\n\nSe generará una mora de $${mora}. Puede pagarse en el panel de Moras.`
        : `¿Registrar devolución de "${nombreLibro}"?`;
      if (!confirm(msg)) return;
      try {
        const res  = await fetch(`/api/prestamos/${id}/devolver`, { method: 'PUT' });
        const data = await res.json();
        if (res.ok) {
          const moraTxt = data.mora > 0 ? ` · Mora generada: $${data.mora}` : '';
          toast(`Devolución registrada${moraTxt}`, 'ok');
          cargar();
        } else { toast(data.mensaje, 'err'); }
      } catch (e) { toast('Error al registrar la devolución.', 'err'); }
    }

    document.getElementById('filtro').addEventListener('input', renderTabla);
    document.getElementById('filtroEstado').addEventListener('change', renderTabla);

    cargar();
  </script>
</body>
</html>
